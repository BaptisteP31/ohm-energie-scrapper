services:
  ohm-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    image: ohm-scraper:latest
    container_name: ohm-scraper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_HOST: "0.0.0.0"
    ports:
      - "${OHM_PUBLISH_ADDRESS:-127.0.0.1}:${SERVICE_PORT:-8080}:${SERVICE_PORT:-8080}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request; port = os.environ.get('SERVICE_PORT', '8080'); urllib.request.urlopen(f'http://127.0.0.1:{port}/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
