[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ohm-energie-scrapper"
version = "0.1.0"
description = "Accès en lecture seule aux données de l'espace client Ohm Énergie (API non officielle, usage personnel)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ohm-scraper = "ohm_scraper.cli:main"

[tool.setuptools]
packages = ["ohm_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
